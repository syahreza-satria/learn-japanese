name: Validasi data

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "src/lib/**"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validasi JSON terhadap schema
        run: node scripts/validate-data.mjs
      - name: Tes logika & data
        run: node --test
